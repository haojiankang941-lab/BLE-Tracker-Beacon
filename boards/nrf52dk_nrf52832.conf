#
# nRF52 DK (nRF52832) board configuration
#

# ---------------------------------------------------------------------------
# Console
# ---------------------------------------------------------------------------
# The nRF52 DK has an on-board VCOM, and the console uses UART0 (P0.06 TX /
# P0.08 RX), which the board's nrf52dk_nrf52832_defconfig already provides:
#     CONFIG_SERIAL=y  CONFIG_CONSOLE=y  CONFIG_UART_CONSOLE=y
# Nothing here needs to redirect the console to USB CDC ACM: the nRF52832 has no
# USB peripheral at all, so such an overlay would fail devicetree parsing.
CONFIG_UART_INTERRUPT_DRIVEN=y

# ---------------------------------------------------------------------------
# Battery monitoring: the nrfx SAADC driver (CONFIG_NRFX_SAADC lives in prj.conf).
# CONFIG_ADC must stay off, or Zephyr's adc_nrfx_saadc.c would contend with the
# hand-written nrfx_saadc_init() in main.c for the same peripheral (double
# IRQ_CONNECT, double init).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Logging: deliberately off
# ---------------------------------------------------------------------------
# CONFIG_LOG is not enabled: the project does not use the log subsystem, and on an
# nRF52832 with 64 KB of RAM it would only consume space. printk() goes to the
# console directly and needs none of it. Uncomment the three lines below to turn
# logging on while debugging.
#
# CONFIG_LOG=y
# CONFIG_LOG_MODE_DEFERRED=y
# CONFIG_LOG_BACKEND_UART=y
