# Button and LED library
CONFIG_DK_LIBRARY=y

# Bluetooth LE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y

# Standard Battery Service (Battery Service 0x180F / Battery Level 0x2A19).
# The Zephyr built-in implementation is used rather than a hand-written set of
# GATT attributes: the service is defined in
# zephyr/subsys/bluetooth/services/bas/bas.c:75-93 and mounted automatically by
# SYS_INIT (same file, :140), so the application only has to call
# bt_bas_set_battery_level(). The payoff is that Battery Level carries the READ
# property -- a phone can read it without subscribing -- and nRF Connect shows
# "Battery Service / Battery Level" instead of "Unknown Characteristic".
CONFIG_BT_BAS=y

# RSSI queries. Under the SoftDevice Controller the dispatch of HCI Read RSSI
# (opcode 0x1405) is gated on this symbol: with it off the opcode falls through
# to the default branch and the controller answers BT_HCI_ERR_UNKNOWN_CMD, so
# every bt_hci_cmd_send_sync() call fails.
# Evidence: nrf/subsys/bluetooth/controller/hci_internal.c:932-944 (command
# dispatch) and :371-372 in the same file (hci_read_rssi in the supported-
# commands bitmap reported to the host).
# The symbol defaults to off and must be set explicitly; changing it requires a
# full rebuild so the SDC glue is recompiled.
CONFIG_BT_CTLR_CONN_RSSI=y

# Fixed pairing passkey, supplied by CONFIG_BT_APP_PASSKEY plus the
# bt_conn_auth_cb.app_passkey callback. The older route,
# CONFIG_BT_FIXED_PASSKEY + bt_passkey_set(), is deprecated. The two are mutually
# exclusive (BT_APP_PASSKEY depends on !BT_FIXED_PASSKEY), so this is a whole-
# or-nothing replacement.
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_DEVICE_NAME="Tracker Beacon"

# Enable PHY updates.
CONFIG_BT_USER_PHY_UPDATE=y

# ADC enable.
CONFIG_NRFX_SAADC=y

# Increase stack size for the main thread and the system workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Data Length and MTU
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_GATT_CLIENT=y

# Reboot on disconnect: the translation unit implementing sys_reboot() is only
# compiled in when CONFIG_REBOOT=y (zephyr/lib/os/CMakeLists.txt).
CONFIG_REBOOT=y

# Power management.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# The buzzer is driven through PWM. Only the PWM subsystem has to be enabled:
# CONFIG_PWM_NRFX is selected automatically from the devicetree, because its
# Kconfig says "default y / depends on DT_HAS_NORDIC_NRF_PWM_ENABLED" and the
# board overlay sets pwm1 to okay.
CONFIG_PWM=y

# MPSL assertion handling. The default implementation truncates the file name to
# 10 characters, printk()s it to the UART and calls k_oops(); on this board UART0
# is not routed to the J-Link VCOM, so that message is never seen. With this
# enabled the application-supplied mpsl_assert_handle(file, line) takes over and
# receives the full path and line number (see main.c).
CONFIG_MPSL_ASSERT_HANDLER=y
